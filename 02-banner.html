<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner - Brooklyn David</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-navy: #182430;
    --mustard: #d3a13f;
    --kraft-tan: #c9a876;
    --cream-text: #f4efe2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    width: 100%; 
    height: 100%; 
    background: var(--bg-navy);
    overflow: hidden;
  }

  .banner-container {
    width: 100%;
    min-height: 220px;
    background: var(--bg-navy);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 20px;
    text-align: center;
    user-select: none;
  }

  /* Pixar bounce letter layout */
  .title-wrapper {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    margin-bottom: 12px;
  }

  .word {
    display: flex;
    margin: 0 0.22em;
  }

  .letter {
    display: inline-block;
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 6vw, 58px);
    font-weight: 700;
    color: var(--mustard);
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.35);
    transform-origin: bottom center;
    animation: pixarBounce 4s cubic-bezier(0.28, 0.84, 0.42, 1) infinite;
    animation-delay: calc(var(--i) * 0.09s);
  }

  /* Squash & Stretch Animation Keyframes */
  @keyframes pixarBounce {
    0% {
      transform: translateY(-90px) scale(0.7, 1.4);
      opacity: 0;
    }
    22% {
      transform: translateY(0) scale(1.35, 0.65); /* Impact squash */
      opacity: 1;
    }
    35% {
      transform: translateY(-32px) scale(0.82, 1.22); /* Elastic rebound */
    }
    48% {
      transform: translateY(0) scale(1.15, 0.88); /* Secondary squash */
    }
    60% {
      transform: translateY(-10px) scale(0.95, 1.05); /* Mini settle hop */
    }
    70%, 90% {
      transform: translateY(0) scale(1, 1); /* Rest position */
    }
    98%, 100% {
      transform: translateY(0) scale(1, 1);
    }
  }

  /* Subtitle Styling */
  .subtitle {
    font-family: 'Space Mono', monospace;
    font-size: clamp(11px, 2.2vw, 14px);
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: var(--kraft-tan);
    opacity: 0;
    transform: translateY(10px);
    animation: fadeInSub 1s ease forwards;
    animation-delay: 1.4s;
  }

  @keyframes fadeInSub {
    to {
      opacity: 0.9;
      transform: translateY(0);
    }
  }

  @media (max-width: 600px) {
    .banner-container { padding: 26px 14px; min-height: 180px; }
    .word { margin: 0 0.15em; }
  }
</style>
</head>
<body>
  <div class="banner-container">
    <div class="title-wrapper">
      <div class="word">
        <span class="letter" style="--i:0">B</span>
        <span class="letter" style="--i:1">R</span>
        <span class="letter" style="--i:2">O</span>
        <span class="letter" style="--i:3">O</span>
        <span class="letter" style="--i:4">K</span>
        <span class="letter" style="--i:5">L</span>
        <span class="letter" style="--i:6">Y</span>
        <span class="letter" style="--i:7">N</span>
      </div>
      <div class="word">
        <span class="letter" style="--i:8">D</span>
        <span class="letter" style="--i:9">A</span>
        <span class="letter" style="--i:10">V</span>
        <span class="letter" style="--i:11">I</span>
        <span class="letter" style="--i:12">D</span>
      </div>
    </div>
    <div class="subtitle">Commander</div>
  </div>
</body>
</html>
