<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-navy:#182430;
    --denim-1:#2f4d64;
    --denim-3:#3d6480;
    --mustard:#d3a13f;
    --kraft-tan:#c9a876;
    --cream-text:#f4efe2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;height:100%;}

  /*
    BANNER PLACEHOLDER
    ---------------------------------------------------------
    Swap for a real image later by replacing the background
    line below, e.g.:
    background-image:url('images/banner.jpg');
    background-size:cover; background-position:center;
    Suggested source image size: ~1600x600px (roughly 8:3 ratio)
  */
  .banner{
    width:100%;
    height:100%;
    min-height:260px;
    background:
      repeating-linear-gradient(135deg, rgba(244,239,226,0.07) 0 14px, transparent 14px 28px),
      linear-gradient(135deg, var(--denim-3) 0%, var(--denim-1) 55%, var(--ink-navy) 100%);
    border-bottom:3px solid var(--mustard);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .banner::before{
    content:"";
    position:absolute;
    inset:18px;
    border:2px dashed rgba(244,239,226,0.35);
    pointer-events:none;
  }
  .banner-label{
    font-family:'Space Mono',monospace;
    color:var(--cream-text);
    text-align:center;
    letter-spacing:.08em;
    position:relative;
    z-index:1;
    padding:0 16px;
  }
  .banner-label .big{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-weight:600;
    font-size:clamp(22px, 3.4vw, 34px);
    letter-spacing:.02em;
    color:var(--kraft-tan);
    display:block;
    margin-bottom:10px;
  }
  .banner-label .small{
    font-size:11px;
    text-transform:uppercase;
    color:#c9d1d6;
    display:block;
  }
  .banner-label .dims{
    font-size:10px;
    color:#8fa1ab;
    display:block;
    margin-top:6px;
  }
</style>
</head>
<body>
  <div class="banner" aria-hidden="true">
    <div class="banner-label">
      <span class="big">Banner goes here</span>
      <span class="small">Placeholder &middot; replace with header image</span>
      <span class="dims">Suggested size &middot; 1600 &times; 600px</span>
    </div>
  </div>
</body>
</html>
